[package]
name = "yt-quality"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
native-stems = ["yt-media/native-stems"]
metal-stems = ["yt-media/metal-stems"]

[dependencies]
rustfft = "6.4"
sha2 = "0.10"
soxr-sys = "0.1.3"
tempfile = "3"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
yt-media = { path = "../yt-media" }
rodio = { version = "0.21.1", default-features = false }

[dev-dependencies]
serde_json = "1"
yt-audio = { path = "../yt-audio" }
hound = "3.5"

