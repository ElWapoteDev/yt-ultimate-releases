[package]
name = "yt-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Cross-platform Rust library, settings and job persistence for YT Ultimate"
license.workspace = true

[dependencies]
lofty = "0.22.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
sha2 = "0.10"
tempfile = "3"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
