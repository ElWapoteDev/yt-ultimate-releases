[package]
name = "yt-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Cross-platform Rust library, settings and job persistence for YT Ultimate"
license.workspace = true

[dependencies]
lofty = "0.22.4"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
