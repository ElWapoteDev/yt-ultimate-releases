[package]
name = "yt-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Verified, user-installed desktop updates for YT Ultimate"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "time", "macros", "rt"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
